name: Build Container

on:
    # Trigger on pushes to main, but only when source or workflow files change.
    # This avoids unnecessary builds for docs/k8s manifest changes.
    push:
      branches: 
        - main
      paths:
          - 'src/**'
          - '.github/**'
    # Trigger on PRs to main for the same path scope.
    # Note: secrets are NOT available to fork PRs for security reasons.
    pull_request:
      types:
        - opened
        - reopened
        - synchronize
      paths:
        - 'src/**'
        - '.github/**'
    # Allow manual runs from the GitHub UI or CLI (gh workflow run).
    # Inputs below are surfaced as a form in the UI when triggering manually.
    workflow_dispatch:
      inputs:
        push:
          description: 'Push the built image to Docker Hub - ignored for non-manual triggers'
          type: boolean
          default: false
        custom_tag:
          description: 'Custom tag to apply to the built image (overrides versioning from GitVersion)'
          type: string
          default: ''

env:
  DOCKERHUB_REPO: 'coryreid/randomquotes-k8s'

jobs:
    build-and-push-application:
        runs-on: ubuntu-latest
        steps:
            # Full history is required for GitVersion to correctly calculate
            # the semantic version by walking the commit graph.
            - uses: actions/checkout@v4
              with:
                fetch-depth: '0'
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
            # GitVersion inspects commit history to derive a semantic version automatically.
            # No manual tagging or version files required.
            # Mode and other config is defined in /GitVersion.yml at the repo root.
            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v4.4.2
              with:
                  versionSpec: 6.7.x
            - id: determine_version
              name: Determine Version
              uses: gittools/actions/gitversion/execute@v4.4.2
              with:
                  configFilePath: GitVersion.yml
            # Authenticate to Docker Hub before build so the push step has credentials.
            # DOCKERHUB_PAT_USERNAME and DOCKERHUB_PAT are stored as repo secrets.
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_PAT_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PAT }}
            - name: Build and push website container
              uses: docker/build-push-action@v6
              with:
                # Build context is the src/ directory - the Dockerfile expects this layout.
                # See Dockerfile comments for details on why context must be src/.
                context: src
                file: src/RandomQuotes.Web/Dockerfile
                push: ${{ github.event_name == 'push' || inputs.push == true }}
                platforms: linux/amd64
                # Tag with both the version from GitVersion and "latest" for easy reference. 
                # Allow overriding the version tag via workflow_dispatch input for flexibility.
                tags: |
                  ${{ env.DOCKERHUB_REPO }}:${{ inputs.custom_tag || steps.determine_version.outputs.semVer }}
                  ${{ env.DOCKERHUB_REPO }}:latest