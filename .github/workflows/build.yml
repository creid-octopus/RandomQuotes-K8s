name: Build Container

on:
    # Trigger on pushes to main, but only when source or workflow files change.
    # This avoids unnecessary builds for docs/k8s manifest changes.
    push:
      branches:
        - main
        - 'feature/**'
      paths:
          - 'src/**'
          - '.github/**'
    # Trigger on PRs to main for the same path scope.
    # Note: secrets are NOT available to fork PRs for security reasons.
    pull_request:
      types:
        - opened
        - reopened
        - synchronize
      paths:
        - 'src/**'
        - '.github/**'
    # Allow manual runs from the GitHub UI or CLI (gh workflow run).
    # Inputs below are surfaced as a form in the UI when triggering manually.
    workflow_dispatch:
      inputs:
        push:
          description: 'Push the built image to Docker Hub - ignored for non-manual triggers'
          type: boolean
          default: false
        custom_tag:
          description: 'Custom tag to apply to the built image (overrides versioning from GitVersion)'
          type: string
          default: ''

env:
  DOCKERHUB_REPO: 'octopuscory/randomquotes-k8s'
  OCTOPUS_SERVER_URL: 'https://demo.octopus.app'
  OCTOPUS_SPACE: 'LDX3'
  OCTOPUS_PROJECT: 'Random Quotes - Kustomize'
  OCTOPUS_CHANNEL: 'PR Deployments'

jobs:
    build-and-push-application:
        runs-on: ubuntu-latest
        # feature/** is already in the push trigger, so a PR opened from a branch in
        # this same repo fires push AND pull_request for the same commit, a duplicate
        # build. pull_request exists for fork PRs, which never fire push at all since
        # forks can't push here. Skip this run when it's a same-repo pull_request,
        # push already covers it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
        steps:
            # Full history is required for GitVersion to correctly calculate
            # the semantic version by walking the commit graph.
            - uses: actions/checkout@v4
              with:
                fetch-depth: '0'
                fetch-tags: true
            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
            # GitVersion inspects commit history to derive a semantic version automatically.
            # No manual tagging or version files required.
            # Mode and other config is defined in /GitVersion.yml at the repo root.
            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v4.4.2
              with:
                  versionSpec: 6.7.x
            - id: determine_version
              name: Determine Version
              uses: gittools/actions/gitversion/execute@v4.4.2
              with:
                  configFilePath: GitVersion.yml
            # feature/* branches get their own tag scheme, independent of GitVersion's
            # semVer: a stable slug (no SHA) identifies the branch/ephemeral environment
            # consistently across pushes, and a separate SHA-suffixed image tag forces
            # Kubernetes to actually notice the image changed and roll the deployment on
            # every push. GitVersion's semVer is still used as the Octopus release number,
            # unrelated to the image tag for feature branches.
            - id: branch_meta
              name: Compute branch slug and image tag
              if: startsWith(github.ref_name, 'feature/')
              run: |
                SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-30)
                SHORT_SHA="${GITHUB_SHA:0:7}"
                echo "branch_slug=pr-${SLUG}" >> "$GITHUB_OUTPUT"
                echo "image_tag=pr-${SLUG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            # Authenticate to Docker Hub before build so the push step has credentials.
            # DOCKERHUB_PAT_USERNAME and DOCKERHUB_PAT are stored as repo secrets.
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_PAT_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PAT }}
            # feature/* branches get only their own SHA-suffixed tag, no "latest" -
            # latest should always mean "most recent main build", never a feature branch.
            - id: docker_tags
              name: Compute Docker tags
              run: |
                if [ "${{ startsWith(github.ref_name, 'feature/') }}" = "true" ]; then
                  printf 'tags<<EOF\n%s:%s\nEOF\n' "${{ env.DOCKERHUB_REPO }}" "${{ steps.branch_meta.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
                else
                  printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "${{ env.DOCKERHUB_REPO }}" "${{ inputs.custom_tag || steps.determine_version.outputs.semVer }}" "${{ env.DOCKERHUB_REPO }}" >> "$GITHUB_OUTPUT"
                fi
            - name: Build and push website container
              uses: docker/build-push-action@v6
              with:
                # Build context is the src/ directory - the Dockerfile expects this layout.
                # See Dockerfile comments for details on why context must be src/.
                context: src
                file: src/RandomQuotes.Web/Dockerfile
                push: ${{ github.event_name == 'push' || inputs.push == true }}
                platforms: linux/amd64
                tags: ${{ steps.docker_tags.outputs.tags }}
            # Release creation lives here, not in an Octopus feed trigger - a trigger
            # only sees "a new package version appeared" with no build context, so it
            # can't stamp a custom field. BranchSlug is what the ephemeral environment
            # name template and the parent-scoped namespace variable both key off, no
            # SHA here on purpose, it needs to stay stable across pushes to the same
            # branch so Octopus redeploys into the *same* environment each time.
            - name: Create Octopus release for PR Deployments
              if: startsWith(github.ref_name, 'feature/') && github.event_name == 'push'
              uses: OctopusDeploy/create-release-action@v3
              with:
                server: ${{ env.OCTOPUS_SERVER_URL }}
                api_key: ${{ secrets.OCTOPUS_API_KEY }}
                space: ${{ env.OCTOPUS_SPACE }}
                project: ${{ env.OCTOPUS_PROJECT }}
                channel: ${{ env.OCTOPUS_CHANNEL }}
                release_number: ${{ steps.determine_version.outputs.semVer }}
                package_version: ${{ steps.branch_meta.outputs.image_tag }}
                custom_fields: |
                  BranchSlug:${{ steps.branch_meta.outputs.branch_slug }}